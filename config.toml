# PHARE load-estimator configuration.
# All fields shown have defaults if omitted; only [[levels]] is required.

delta_i_km = 100.0          # ion inertial length (THE physical-scale knob)
re_km = 6371.2

target_hours = 1.0          # physical run duration

# Time-step is anchored physically at L1 (the first PIC level), then scaled
# to other levels via dt_ratio_per_level (= 4 for refinement ratio 2 in space).
omega_ci_inverse_s = 1.0    # physical duration of 1/Ω_ci, in seconds
dt_L1_omega_ci = 0.05       # L1 timestep in units of 1/Ω_ci
# dt_finest_s = ...         # optional absolute override
dt_ratio_per_level = 4.0    # dt(level n) = dt_ratio * dt(level n+1)

dayside_only = true         # PIC AMR only in the +x_GSE half-space
sample_dx_re = 0.5          # probe-grid resolution for volume integration

# Reference uniform run resolution(s). Specify exactly one of:
#   reference_dx_di = 0.1            (single reference; scales with delta_i_km)
#   reference_dx_di = [1.0, 0.1]     (multiple — e.g. coarse 1 δᵢ baseline + fine 0.1 δᵢ target)
#   reference_dx_km = 10.0           (absolute, single)
#   reference_dx_km = [100.0, 10.0]  (absolute, multiple)
reference_dx_di = [1.0, 0.1]

# "Cheat" knob to control the magnetosphere size. 1.0 = Earth's actual dipole.
# Both MP and BS get scaled by dipole_strength^(1/3) (pressure-balance scaling).
# 0.5 → magnetosphere ~21% smaller; 0.125 → half size; 0.001 → MP at ~1 Re.
dipole_strength = 1.0

[particle]
ppc = 100
bytes_per_particle = 76     # PHARE per-particle memory footprint
sec_per_particle_per_step = 10e-9   # single-thread cost model

[domain]
# Standard GSE: +x toward the Sun, -x toward the tail. All values in Earth radii.
x_min = -100.0
x_max = 50.0
y_min = -50.0
y_max = 50.0
z_min = -50.0
z_max = 50.0

[solar_wind]
n_cm3 = 5.0
v_kms = 400.0
bz_nt = 0.0

# Levels are listed coarsest first; the last entry is the finest and
# carries the base dt. For each level, specify exactly one of:
#   dx_di = ...   (resolution in units of delta_i — scales with delta_i_km)
#   dx_km = ...   (absolute resolution in km)
#
# region = "full"  : whole domain
# region = "shell" : sheath shell, requires pad_re (Re inside MP, outside BS)
# region = "band"  : ±band_re around boundary surfaces
#   boundaries = ["mp", "bs"]  (default: both surfaces)
#   boundaries = ["mp"]        (magnetopause only)
#   boundaries = ["bs"]        (bow shock only)

[[levels]]
name = "L0"
kind = "mhd"
dx_di = 1.6
region = "full"

[[levels]]
name = "L1"
kind = "pic"
dx_di = 0.8
region = "shell"
pad_re = 3.0

[[levels]]
name = "L2"
kind = "pic"
dx_di = 0.4
region = "band"
band_re = 1.5
boundaries = ["mp"]

[[levels]]
name = "L3"
kind = "pic"
dx_di = 0.2
region = "band"
band_re = 0.5
boundaries = ["mp"]

[[levels]]
name = "L4"
kind = "pic"
dx_di = 0.1
region = "band"
band_re = 0.25
boundaries = ["mp"]
